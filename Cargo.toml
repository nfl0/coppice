[workspace]
resolver = "2"
members = [
    "crates/coppice",
    "crates/coppice-core",
    "crates/coppice-librustzcash",
    "crates/coppice-zcash-rpc",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
repository = "https://github.com/nfl0/coppice"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }

[workspace.dependencies]
blake2b_simd = "1"
base64 = "0.22"
coppice = { path = "crates/coppice" }
coppice-core = { path = "crates/coppice-core" }
hex = "0.4"
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
orchard = { package = "zakura-orchard", version = "=1.0.0", features = ["std"] }
rand_chacha = "0.10"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_note_encryption = "0.4.2"
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc4", features = ["orchard"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0", features = ["std"] }
zcash_protocol = { version = "=0.10.5", features = ["std", "local-consensus"] }

# Halo2 and Ironwood proving are impractically slow without optimization, including in tests.
[profile.test]
opt-level = 3
